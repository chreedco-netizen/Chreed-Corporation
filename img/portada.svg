<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Sitio web profesional diseñado por Chreed Corporation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F1F5"/>
      <stop offset="1" stop-color="#EBE3E9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A033D"/>
      <stop offset="1" stop-color="#6B1A5C"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4A033D" flood-opacity="0.18"/>
    </filter>
    <!-- Símbolo Chreed (montaña escalonada) -->
    <g id="logo">
      <polygon points="0,30 25,0 50,30" />
      <polygon points="0,33 25,15 50,33" fill="#FFFFFF" fill-opacity="0"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Ventana del navegador -->
  <g filter="url(#sh)">
    <rect x="60" y="40" width="680" height="420" rx="14" fill="#FFFFFF"/>
  </g>
  <rect x="60" y="40" width="680" height="40" rx="14" fill="#EBE3E9"/>
  <rect x="60" y="66" width="680" height="14" fill="#EBE3E9"/>
  <circle cx="86" cy="60" r="6" fill="#E8B04B"/>
  <circle cx="106" cy="60" r="6" fill="#DDD6DC"/>
  <circle cx="126" cy="60" r="6" fill="#DDD6DC"/>
  <rect x="160" y="50" width="420" height="20" rx="10" fill="#FFFFFF"/>
  <text x="178" y="64" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7D717A">tunegocio.com</text>

  <!-- Encabezado del sitio -->
  <rect x="60" y="80" width="680" height="190" fill="url(#hero)"/>
  <!-- Logo en blanco -->
  <g transform="translate(84,94)" fill="#FFFFFF">
    <polygon points="0,22 17,0 34,22 34,24 17,9 0,24"/>
    <polygon points="0,27 17,13 34,27 34,29 17,17 0,29"/>
    <polygon points="0,30 17,21 34,30"/>
    <rect x="0" y="32" width="34" height="2.5"/>
  </g>
  <rect x="128" y="104" width="70" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="128" y="117" width="44" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.5"/>
  <rect x="470" y="104" width="46" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="528" y="104" width="46" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="586" y="104" width="46" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="648" y="96" width="70" height="24" rx="6" fill="#E8B04B"/>

  <rect x="84" y="150" width="300" height="18" rx="5" fill="#FFFFFF"/>
  <rect x="84" y="176" width="230" height="18" rx="5" fill="#FFFFFF"/>
  <rect x="84" y="206" width="270" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="84" y="219" width="220" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="84" y="238" width="104" height="22" rx="6" fill="#E8B04B"/>
  <rect x="198" y="238" width="104" height="22" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Símbolo grande decorativo -->
  <g transform="translate(470,140) scale(4)" fill="#FFFFFF" fill-opacity="0.14">
    <polygon points="0,22 25,-6 50,22 50,24 25,4 0,24"/>
    <polygon points="0,27 25,9 50,27 50,29 25,13 0,29"/>
    <polygon points="0,31 25,18 50,31"/>
  </g>

  <!-- Tarjetas de beneficios -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="84" y="290" width="196" height="146" rx="10" fill="#FFFFFF" stroke="#DDD6DC"/>
    <rect x="302" y="290" width="196" height="146" rx="10" fill="#FFFFFF" stroke="#DDD6DC"/>
    <rect x="520" y="290" width="196" height="146" rx="10" fill="#FFFFFF" stroke="#DDD6DC"/>

    <circle cx="112" cy="320" r="13" fill="#FDF5E6"/>
    <polyline points="104,325 110,319 114,322 120,315" fill="none" stroke="#E8B04B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="320" r="13" fill="#FDF5E6"/>
    <rect x="323" y="314" width="14" height="12" rx="2" fill="none" stroke="#E8B04B" stroke-width="2.5"/>
    <circle cx="548" cy="320" r="13" fill="#FDF5E6"/>
    <circle cx="548" cy="320" r="7" fill="none" stroke="#E8B04B" stroke-width="2.5"/>

    <rect x="100" y="346" width="110" height="10" rx="5" fill="#1F1A1E" fill-opacity="0.85"/>
    <rect x="318" y="346" width="110" height="10" rx="5" fill="#1F1A1E" fill-opacity="0.85"/>
    <rect x="536" y="346" width="110" height="10" rx="5" fill="#1F1A1E" fill-opacity="0.85"/>
    <g fill="#5A4F57" fill-opacity="0.35">
      <rect x="100" y="368" width="160" height="6" rx="3"/>
      <rect x="100" y="380" width="140" height="6" rx="3"/>
      <rect x="100" y="392" width="150" height="6" rx="3"/>
      <rect x="318" y="368" width="160" height="6" rx="3"/>
      <rect x="318" y="380" width="140" height="6" rx="3"/>
      <rect x="318" y="392" width="150" height="6" rx="3"/>
      <rect x="536" y="368" width="160" height="6" rx="3"/>
      <rect x="536" y="380" width="140" height="6" rx="3"/>
      <rect x="536" y="392" width="150" height="6" rx="3"/>
    </g>
    <rect x="100" y="410" width="60" height="8" rx="4" fill="#4A033D"/>
    <rect x="318" y="410" width="60" height="8" rx="4" fill="#4A033D"/>
    <rect x="536" y="410" width="60" height="8" rx="4" fill="#4A033D"/>
  </g>

  <!-- Insignia de celular -->
  <g filter="url(#sh)">
    <rect x="664" y="300" width="96" height="170" rx="14" fill="#1F1A1E"/>
  </g>
  <rect x="670" y="312" width="84" height="146" rx="8" fill="#FFFFFF"/>
  <rect x="670" y="312" width="84" height="54" rx="8" fill="url(#hero)"/>
  <rect x="670" y="352" width="84" height="14" fill="url(#hero)"/>
  <rect x="680" y="328" width="56" height="7" rx="3.5" fill="#FFFFFF"/>
  <rect x="680" y="340" width="40" height="7" rx="3.5" fill="#FFFFFF"/>
  <rect x="680" y="376" width="64" height="26" rx="5" fill="#F6F1F5" stroke="#DDD6DC"/>
  <rect x="680" y="408" width="64" height="26" rx="5" fill="#F6F1F5" stroke="#DDD6DC"/>
  <rect x="680" y="440" width="40" height="10" rx="5" fill="#E8B04B"/>
  <rect x="700" y="304" width="24" height="4" rx="2" fill="#5A4F57"/>
</svg>
